# Alembic configuration for CODE MAZE
# The sqlalchemy.url is overridden at runtime by alembic/env.py reading DATABASE_URL_SYNC from env

[alembic]
script_location = alembic
# Placeholder — env.py will override this from DATABASE_URL_SYNC environment variable
sqlalchemy.url = sqlite:///./codemaze.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
