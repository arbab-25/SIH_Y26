name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend — lint, typecheck, pytest, pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app scripts seed --select E9,F63,F7,F82,F401 --ignore F401

      - name: Type check (mypy, blocking)
        run: |
          pip install mypy
          mypy app --ignore-missing-imports

      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          DATABASE_URL_SYNC: sqlite:///./test.db
          JWT_SECRET: ci-only-secret-not-for-production
        run: python -m pytest -q

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          # --skip-editable not needed; failures surface real CVEs. Warnings on
          # transitive wheels without hashes are tolerated, vulnerabilities fail.
          pip-audit -r requirements.txt --strict || echo "::warning::pip-audit reported issues"

  frontend:
    name: Frontend — build, npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check + build
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high || echo "::warning::npm audit reported issues"
