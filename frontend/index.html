<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts loaded via preconnected <link>s: a CSS @import serialises
         stylesheet fetches (page CSS -> font CSS) and delays first paint.
         Same families, same URL — just fetched in parallel. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap"
    />
    <title>CodeMaze - Legal Metrology Compliance Checker</title>
    <meta
      name="description"
      content="CodeMaze lets Legal Metrology inspectors scan packaged commodity labels against the Legal Metrology (Packaged Commodities) Rules, 2011, review rule-cited declarations, and export or email a compliance report."
    />
    <meta name="theme-color" content="#12355B" />
    <meta name="apple-mobile-web-app-title" content="CodeMaze" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodeMaze" />
    <meta property="og:title" content="CodeMaze - Legal Metrology Compliance Checker" />
    <meta
      property="og:description"
      content="Scan a packaged commodity label and get a deterministic, rule-cited compliance verdict under the Legal Metrology (Packaged Commodities) Rules, 2011."
    />
    <meta property="og:image" content="/logo.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
